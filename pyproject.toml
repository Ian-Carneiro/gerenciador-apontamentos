[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gerenciador-apontamentos"
version = "5.0.0"
description = "Aplicação desktop para registro e envio automatizado de apontamentos de horas"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.44",
    "pyside6>=6.7",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "screeninfo>=0.8",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.4",
]

[project.scripts]
apontador = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ── Ruff ──────────────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
exclude = [
    ".venv",
    ".git",
    "__pycache__",
    "build",
    "dist",
    "data",
    "logs",
    "resources",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",
    "B008",
    "SIM108",
    "RUF001",  # caracteres unicode em strings/logs (emojis, símbolos)
    "RUF002",  # em dash em docstrings
    "RUF003",  # em dash em comentários
]

[tool.ruff.lint.isort]
known-first-party = ["src", "config"]
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert é esperado em testes

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ── Pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
